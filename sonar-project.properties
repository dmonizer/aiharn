# SonarCloud project identity. These values are generated by SonarCloud when
# the repository is set up (https://sonarcloud.io/projects/create).
# Update them to match your SonarCloud organization key and project key.
sonar.organization=dmonizer-github
sonar.projectKey=aiharn

# Analyze the whole repository.
sonar.sources=.

# Go coverage produced by the CI job (go test -coverprofile=coverage.out ./...).
sonar.go.coverage.reportPaths=coverage.out

# Only Go non-test files are exercised by `go test -coverprofile`; exclude test
# files and the frontend (no JS test runner) from the coverage metric, and keep
# test-file duplication out of the copy-paste gate.
sonar.coverage.exclusions=**/*_test.go,web/**
sonar.cpd.exclusions=**/*_test.go
